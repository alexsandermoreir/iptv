<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IPTV">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="no-referrer">
  <title>IPTV Premium</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="boot" class="center"><div class="spinner" aria-label="Carregando"></div></div>

  <section id="gate" class="center" hidden>
    <div class="gate-card">
      <div class="logo big" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#26c6b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M9 3l3 3 3-3"/><path d="M10.5 10.5v4l3.5-2z" fill="#26c6b0"/></svg></div>
      <h1>IPTV Premium</h1>
      <p>Suas listas, canais, filmes e séries — e o ponto onde você parou — na TV e no navegador, ligados à sua conta Google.</p>
      <button id="signin" class="primary lg">Entrar com Google</button>
      <p><button id="signin-alt" type="button" hidden>Outra forma de entrar</button></p>
      <p id="setup-banner" class="warn" hidden>O Firebase ainda não está configurado neste site (firebase-config.js).</p>
      <p id="gate-note" class="small dim" hidden></p>
      <p id="gate-err" class="err" hidden style="user-select:text;-webkit-user-select:text"></p>
    </div>
  </section>

  <div id="app" hidden>
    <nav id="nav" aria-label="Menu principal">
      <div class="brand"><span class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#26c6b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M9 3l3 3 3-3"/><path d="M10.5 10.5v4l3.5-2z" fill="#26c6b0"/></svg></span><b>IPTV Premium</b></div>
      <button data-v="home">Início</button>
      <button data-v="live">TV ao vivo</button>
      <button data-v="movies">Filmes</button>
      <button data-v="series">Séries</button>
      <button data-v="search">Pesquisa</button>
      <button data-v="library">Minha biblioteca</button>
      <button data-v="settings">Configurações</button>
      <div class="grow"></div>
      <button id="who" class="who" title="Trocar de perfil"><span class="av" id="who-av">?</span><span id="who-name"></span></button>
      <div id="syncline" class="small dim" aria-live="polite"></div>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>

  <div id="player" hidden>
    <div class="ptop">
      <button id="p-close" aria-label="Fechar player">‹ Voltar</button>
      <div class="ptitle"><b id="p-title"></b><span id="p-sub" class="dim small"></span></div>
      <select id="p-var" aria-label="Qualidade" hidden></select>
      <button id="p-fav" aria-label="Favorito" hidden>☆</button>
    </div>
    <video id="video" controls autoplay playsinline></video>
    <div id="p-msg" class="pmsg" hidden></div>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <dialog id="dlg"></dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="pair-connect.js"></script>
</body>
</html>
